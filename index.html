<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chad Ranking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&display=swap">
<script>try{var t=localStorage.getItem('chad-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#faf9f5;--surface:#fff;--ink:#1f1e1d;--muted:#6b6862;--line:#e8e6dc;--accent:#d97757;--accent-ink:#fff;--ok:#3d7a4f;--err:#b3422b;color-scheme:light;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--surface:#2a2927;--ink:#f5f4ee;--muted:#a3a097;--line:#3d3b37;--ok:#7fc494;--err:#f08c73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1e1d;--surface:#2a2927;--ink:#f5f4ee;--muted:#a3a097;--line:#3d3b37;--ok:#7fc494;--err:#f08c73;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background-color .4s,color .4s}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
background:radial-gradient(circle at 20% 25%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 40%),radial-gradient(circle at 80% 70%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 45%);animation:drift 24s ease-in-out infinite alternate}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font:700 2rem/1.1 Fraunces,Georgia,"Times New Roman",serif;margin:0}h1 .r{color:var(--accent)}
.crown{display:inline-block;transform-origin:50% 90%;animation:crown 3.2s ease-in-out infinite}
h2{font:700 1.3rem Fraunces,Georgia,serif;margin:0 0 4px}
.tag{color:var(--muted);margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;transition:background-color .4s,border-color .4s}
.grid .card{margin-bottom:0}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
ol,ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);
transition:transform .22s,box-shadow .22s,border-color .3s,background-color .4s}
.row:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.09);border-color:var(--accent)}
.row.drag{transform:scale(1.03);box-shadow:0 12px 28px rgba(0,0,0,.2);border-color:var(--accent);z-index:2;position:relative}
.handle{cursor:grab;touch-action:none;color:var(--muted);user-select:none;padding:2px 4px;font-size:1.2rem;transition:color .2s,transform .2s}
.handle:hover{color:var(--accent);transform:scale(1.25)}
.pos{font:700 1.2rem Fraunces,Georgia,serif;color:var(--accent);min-width:1.6em;text-align:center}
.av{width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font:700 1.05rem Fraunces,Georgia,serif;color:var(--accent);
background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:2px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.row:hover .av img,.av.lg:hover img{transform:scale(1.12)}
.av.lg{width:112px;height:112px;font-size:2.6rem;border-color:var(--accent)}
.who{flex:1;min-width:110px;overflow-wrap:anywhere}.who small{display:block;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;transition:color .2s,text-decoration-color .2s}
.link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.pts{color:var(--muted);font-size:.85rem;white-space:nowrap}
button{font:inherit}
.btn{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:transform .15s,filter .2s,opacity .2s}
.btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:not(:disabled):after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.5s ease-in-out infinite}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer;transition:transform .15s,border-color .2s,color .2s,background-color .2s}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn:active,.ghost:active{transform:scale(.92)}
.arrows{display:flex;flex-direction:column;gap:2px}.arrows button{padding:0 8px;line-height:1.2;font-size:.7rem}
.rate{flex-basis:100%;border-top:1px dashed var(--line);padding-top:6px}
.rate summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);border-radius:8px;padding:2px 0;transition:color .2s}
.rate summary::-webkit-details-marker{display:none}
.rate summary:hover{color:var(--accent)}
.rate summary:before{content:"›";display:inline-block;font-size:1.1rem;transition:transform .25s}
.rate[open] summary:before{transform:rotate(90deg)}
.rate .rsum{margin-left:auto;font-variant-numeric:tabular-nums}
.rate-body{display:flex;flex-wrap:wrap;gap:8px 20px;padding-top:8px}
.rate[open] .rate-body{animation:rise .3s}
.rate label{display:flex;align-items:center;gap:8px;font-size:.85rem;flex:1;min-width:150px}
.rate input{flex:1;min-width:80px;accent-color:var(--accent)}
.rate b{min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums;display:inline-block}
.divider{border-top:1px solid var(--line);margin:16px 0 10px;padding-top:10px;font-weight:600}
.status{min-height:1.4em;font-size:.9rem;margin-top:8px}.status.ok{color:var(--ok)}.status.err{color:var(--err)}.status.in{animation:toast .35s}
.empty{color:var(--muted);padding:8px 0}
.medal{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .95rem Fraunces,Georgia,serif;border:2px solid var(--line);flex:none}
.chip{border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:.75rem;color:var(--muted);margin-right:4px;white-space:nowrap}
.g1{--m:#c9a227}.g2{--m:#98a1ab}.g3{--m:#b0703c}
.g1,.g2,.g3{border-color:var(--m);background:color-mix(in srgb,var(--m) 12%,var(--surface))}
.g1 .medal,.g2 .medal,.g3 .medal{background:var(--m);border-color:var(--m);color:#fff}
.g1 .medal{animation:shine 2.4s ease-out infinite}
.score{text-align:right;margin-left:auto}.score b{font:700 1.3rem Fraunces,Georgia,serif}.score small{display:block;color:var(--muted);font-size:.75rem}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.desc{margin:6px 0 0;max-width:60ch;line-height:1.55}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;transition:transform .22s,border-color .3s}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile b{display:block;font:700 1.4rem Fraunces,Georgia,serif}.tile small{color:var(--muted);display:block}
.bar{height:6px;border-radius:9px;background:var(--line);margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:9px}
.big{font:700 3rem/1 Fraunces,Georgia,serif;color:var(--accent);display:inline-block}
/* entrance choreography (runs once per view, not on every live update) */
.enter header,.enter .tag{animation:rise .5s backwards}
.enter .card{animation:rise .55s backwards;animation-delay:calc(var(--i,0)*90ms + 100ms)}
.enter .row{animation:rise .5s backwards;animation-delay:calc(var(--i,0)*50ms + 300ms)}
.enter .tile{animation:pop .5s backwards;animation-delay:calc(var(--i,0)*80ms + 250ms)}
.enter .av.lg,.enter .big{animation:pop .65s backwards;animation-delay:.15s}
.enter .bar i{animation:fill .9s cubic-bezier(.2,.8,.2,1) .4s backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.07)}}
@keyframes fill{from{width:0}}
@keyframes toast{from{opacity:0;transform:translateY(-6px)}}
@keyframes shine{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m) 60%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
@keyframes crown{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(-2px)}}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<script src="roster.js"></script>
<script src="config.js"></script>
</head>
<body>
<main id="app"><p class="empty">Connecting…</p></main>
<script>
"use strict";
/* ---------- roster: owner-only, comes from roster.js in the repo ---------- */
const ROSTER = (window.ROSTER || []).map((p, i) => ({ id: p.id || String(p.name).toLowerCase().replace(/\W+/g, '-'), name: p.name, subtitle: p.subtitle || '', description: p.description || '', image: p.image || '', createdAt: i }));

/* ---------- storage adapters (votes only) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { throw new Error('storage-full'); } }
};
const localAdapter = (() => {
  let vcb = [];
  const votes = () => LS.get('chad:votes', {});
  return {
    mode: 'local', userId: 'local', canWrite: true,
    onRoster(cb) { setTimeout(() => cb(ROSTER), 0); },
    onVotes(cb) { vcb.push(cb); setTimeout(() => cb(votes()), 0); },
    async setMyVote(doc) { const v = votes(); v.local = doc; LS.set('chad:votes', v); vcb.forEach(f => f(v)); }
  };
})();
async function firebaseAdapter(cfg) {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(cfg), auth = Au.getAuth(app), db = F.getFirestore(app);
  const uid = (auth.currentUser || (await Au.signInAnonymously(auth)).user).uid;
  return {
    mode: 'shared', userId: uid, canWrite: null,
    onRoster(cb) { setTimeout(() => cb(ROSTER), 0); },
    onVotes(cb, onErr) {
      F.onSnapshot(F.collection(db, 'votes'), snap => { const o = {}; snap.forEach(d => o[d.id] = d.data()); cb(o); },
        e => { onErr && onErr(e); cb({}); });
    },
    setMyVote(d) { return F.setDoc(F.doc(db, 'votes', uid), d); }
  };
}

/* ---------- constants ---------- */
const DEF = { psl: 4, appeal: 5 };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ptsFor = (i, N) => N > 1 ? (N - 1 - i) / (N - 1) * 100 : 100;
const fmt = n => Number.isFinite(n) ? n.toFixed(1) : '–';

/* ---------- state ---------- */
let storage = localAdapter, notice = '', votesError = '';
let roster = [], votes = {}, rosterLoaded = false, votesLoaded = false;
let myOrder = [], mySkip = [], dirty = false, mineInit = false, openId = null;
let dragging = false, sliding = false, pendingRender = false, statusMsg = '', statusKind = '', statusTimer = null, statusFresh = false, focusKey = null;
let queue = Promise.resolve(), lastDoc = null, animate = true;
const prevNums = {}, openRate = new Set();
const $app = document.getElementById('app');
const byId = id => roster.find(p => p.id === id);
const myDoc = () => votes[storage.userId] || lastDoc || { order: [], scores: {} };

/* ---------- helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}
function setStatus(msg, kind) {
  statusMsg = msg; statusKind = kind; statusFresh = true; clearTimeout(statusTimer);
  if (kind === 'ok') statusTimer = setTimeout(() => { statusMsg = ''; statusKind = ''; render(); }, 3500);
  render();
}
function errMsg(e) {
  const m = String((e && (e.code || e.message)) || e);
  if (/permission|denied/i.test(m)) return "You don't have permission to save. Check the Firestore rules in the README.";
  if (/full|quota/i.test(m)) return 'The database is full, so this could not be saved.';
  return "Couldn't save (" + m + ')';
}
function avatar(p, big) {
  const a = h('div', { class: 'av' + (big ? ' lg' : ''), 'aria-hidden': 'true' }, p.name.trim().charAt(0).toUpperCase());
  if (p.image) {
    const img = h('img', { src: p.image, alt: '', loading: 'lazy' });
    img.addEventListener('error', () => img.remove());
    img.addEventListener('load', () => { a.textContent = ''; a.append(img); });
  }
  return a;
}

/* ---------- aggregation ---------- */
function aggregate() {
  const ids = new Set(roster.map(p => p.id));
  const st = {}; roster.forEach(p => st[p.id] = { p, pts: 0, n: 0, ps: 0, pn: 0, as: 0, an: 0 });
  let ballots = 0;
  Object.keys(votes).sort().map(k => votes[k]).forEach(v => {
    const ord = (v.order || []).filter(id => ids.has(id));
    if (ord.length) ballots++;
    ord.forEach((id, i) => { st[id].pts += ptsFor(i, ord.length); st[id].n++; });
    const sc = v.scores || {};
    for (const id in sc) if (st[id]) {
      if (Number.isFinite(sc[id].psl)) { st[id].ps += Math.min(8, Math.max(1, sc[id].psl)); st[id].pn++; }
      if (Number.isFinite(sc[id].appeal)) { st[id].as += Math.min(10, Math.max(1, sc[id].appeal)); st[id].an++; }
    }
  });
  const all = Object.values(st);
  all.forEach(s => { s.ptsAvg = s.n ? s.pts / s.n : null; s.psl = s.pn ? s.ps / s.pn : null; s.appeal = s.an ? s.as / s.an : null; });
  const nameCmp = (a, b) => a.p.name.localeCompare(b.p.name);
  const ranked = all.filter(s => s.n).sort((a, b) => b.ptsAvg - a.ptsAvg || b.n - a.n || nameCmp(a, b));
  const rankBy = key => {
    const list = all.filter(s => s[key] != null).sort((a, b) => b[key] - a[key] || nameCmp(a, b));
    const m = {}; list.forEach((s, i) => m[s.p.id] = i + 1); return { m, total: list.length };
  };
  return { ballots, ranked, unranked: all.filter(s => !s.n).sort(nameCmp), st, ov: rankBy('ptsAvg'), pr: rankBy('psl'), ar: rankBy('appeal') };
}

/* ---------- writes (serialized) ---------- */
function write(build, okMsg) {
  if (storage.canWrite === false) return setStatus("You don't have permission to save.", 'err');
  if (!storage.userId) return setStatus("Couldn't identify you, so nothing can be saved.", 'err');
  queue = queue.then(async () => {
    try {
      const doc = build(myDoc()); doc.updatedAt = Date.now(); lastDoc = doc;
      await storage.setMyVote(doc);
      if (okMsg) { dirty = false; setStatus(okMsg, 'ok'); } else render();
    } catch (e) { setStatus(errMsg(e), 'err'); }
  });
}
const known = () => roster.map(p => p.id);
const submit = () => write(d => ({ order: myOrder.slice(), scores: d.scores || {}, known: known() }), 'Ballot saved. Thanks!');
function saveScore(id, key, val) {
  write(d => {
    const sc = { ...(d.scores || {}) }; sc[id] = { ...DEF, ...(sc[id] || {}), [key]: val };
    return { order: d.order || [], scores: sc, known: d.known || known() };
  });
}

/* ---------- ballot state ---------- */
function tryInit() {
  if (mineInit || !rosterLoaded || !votesLoaded) return;
  mineInit = true;
  const mine = votes[storage.userId] || {};
  const saved = mine.order || [];
  const ids = roster.map(p => p.id);
  if (saved.length) {
    // people the voter has seen before and left out stay skipped; people added since go to the bottom of the list
    const seen = mine.known || ids;
    myOrder = saved.filter(id => ids.includes(id));
    mySkip = ids.filter(id => !myOrder.includes(id) && seen.includes(id));
    ids.forEach(id => { if (!myOrder.includes(id) && !mySkip.includes(id)) myOrder.push(id); });
  } else { myOrder = ids.slice(); mySkip = []; }
}
function move(id, dir) {
  const i = myOrder.indexOf(id), j = i + dir;
  if (j < 0 || j >= myOrder.length) return;
  [myOrder[i], myOrder[j]] = [myOrder[j], myOrder[i]]; dirty = true; focusKey = (dir < 0 ? 'up' : 'dn') + id; render();
}
function skip(id) { myOrder = myOrder.filter(x => x !== id); mySkip.push(id); dirty = true; render(); }
function rank(id) { mySkip = mySkip.filter(x => x !== id); myOrder.push(id); dirty = true; render(); }
function open(id) { openId = id; animate = true; render(); window.scrollTo(0, 0); }

/* ---------- drag ---------- */
function startDrag(ev, list, row) {
  ev.preventDefault(); dragging = true;
  const handle = ev.currentTarget; handle.setPointerCapture(ev.pointerId); row.classList.add('drag');
  const relabel = () => [...list.children].forEach((li, i) => {
    li.querySelector('.pos').textContent = i + 1;
    li.querySelector('.pts').textContent = Math.round(ptsFor(i, list.children.length)) + ' pts';
  });
  const onMove = e => {
    const sib = [...list.children].filter(c => c !== row);
    const next = sib.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (next) { if (row.nextSibling !== next) list.insertBefore(row, next); } else list.appendChild(row);
    relabel();
  };
  const onUp = () => {
    handle.removeEventListener('pointermove', onMove); handle.removeEventListener('pointerup', onUp); handle.removeEventListener('pointercancel', onUp);
    myOrder = [...list.children].map(li => li.dataset.id); dirty = true; dragging = false; pendingRender = false; render();
  };
  handle.addEventListener('pointermove', onMove); handle.addEventListener('pointerup', onUp); handle.addEventListener('pointercancel', onUp);
}

/* ---------- view pieces ---------- */
function rating(id) {
  const sc = (myDoc().scores || {})[id] || {};
  const slider = (key, label, min, max) => {
    const val = h('b', { text: Number.isFinite(sc[key]) ? sc[key].toFixed(1) : DEF[key].toFixed(1) });
    const inp = h('input', { type: 'range', min, max, step: 0.5, value: Number.isFinite(sc[key]) ? sc[key] : DEF[key], 'aria-label': label + ' rating' });
    inp.addEventListener('input', () => {
      val.textContent = (+inp.value).toFixed(1);
      if (!RM) val.animate([{ transform: 'scale(1.35)', color: 'var(--accent)' }, { transform: 'scale(1)' }], { duration: 200 });
    });
    inp.addEventListener('change', () => saveScore(id, key, +inp.value));
    return h('label', {}, label, inp, val);
  };
  const has = Number.isFinite(sc.psl) || Number.isFinite(sc.appeal);
  const summ = h('summary', {}, h('span', { text: 'Rate PSL & Appeal' }),
    h('span', { class: 'rsum', text: has ? 'PSL ' + fmt(sc.psl ?? DEF.psl) + ' · Appeal ' + fmt(sc.appeal ?? DEF.appeal) : 'Not rated' }));
  const d = h('details', { class: 'rate' }, summ, h('div', { class: 'rate-body' }, slider('psl', 'PSL', 1, 8), slider('appeal', 'Appeal', 1, 10)));
  if (openRate.has(id)) d.open = true;
  d.addEventListener('toggle', () => { if (d.open) openRate.add(id); else openRate.delete(id); });
  return d;
}
function nameBlock(p) {
  return h('div', { class: 'who' }, h('button', { class: 'link', text: p.name, onclick: () => open(p.id) }), p.subtitle ? h('small', { text: p.subtitle }) : null);
}
function myRanking() {
  const N = myOrder.length;
  const list = h('ol');
  myOrder.forEach((id, i) => {
    const p = byId(id); if (!p) return;
    const row = h('li', { class: 'row', 'data-id': id, 'data-flip': 'my:' + id, style: '--i:' + i });
    const handle = h('span', { class: 'handle', text: '⠿', 'aria-hidden': 'true' });
    handle.addEventListener('pointerdown', e => startDrag(e, list, row));
    row.append(handle, h('span', { class: 'pos', text: i + 1 }), avatar(p), nameBlock(p),
      h('span', { class: 'pts', text: Math.round(ptsFor(i, N)) + ' pts' }),
      h('button', { class: 'ghost', text: 'Skip', 'aria-label': 'Skip ' + p.name, onclick: () => skip(id) }),
      h('span', { class: 'arrows' },
        h('button', { class: 'ghost', text: '▲', 'aria-label': 'Move ' + p.name + ' up', 'data-key': 'up' + id, onclick: () => move(id, -1) }),
        h('button', { class: 'ghost', text: '▼', 'aria-label': 'Move ' + p.name + ' down', 'data-key': 'dn' + id, onclick: () => move(id, 1) })),
      rating(id));
    list.append(row);
  });
  const hasSaved = ((votes[storage.userId] || {}).order || []).length > 0 || lastDoc;
  const btn = h('button', { class: 'btn', text: hasSaved ? 'Update ranking' : 'Submit ranking', onclick: submit });
  if (hasSaved && !dirty) btn.disabled = true;
  const skipped = h('ul');
  mySkip.forEach((id, i) => {
    const p = byId(id); if (!p) return;
    skipped.append(h('li', { class: 'row', 'data-flip': 'my:' + id, style: '--i:' + i }, avatar(p), nameBlock(p),
      h('button', { class: 'ghost', text: 'Rank them', 'aria-label': 'Rank ' + p.name, onclick: () => rank(id) }), rating(id)));
  });
  return h('section', { class: 'card', style: '--i:0' },
    h('h2', { text: 'Your ranking' }),
    h('p', { class: 'sub', text: 'Best at the top. The top spot earns 100 points and the bottom 0. Drag or use the arrows, rate on the row, and Skip to leave someone out.' }),
    N ? list : h('p', { class: 'empty', text: 'Nobody in your ranking yet. Pull people in from "Not ranking" below, or submit an empty ranking.' }),
    h('p', {}, btn), h('div', { class: 'status ' + statusKind + (statusFresh ? ' in' : ''), 'aria-live': 'polite', text: statusMsg }),
    h('div', { class: 'divider', text: 'Not ranking' }),
    mySkip.length ? skipped : h('p', { class: 'empty', text: 'Everyone is included in your ranking.' }));
}
function general(a) {
  const list = h('ol');
  a.ranked.forEach((s, i) => list.append(h('li', { class: 'row' + (i < 3 ? ' g' + (i + 1) : ''), 'data-flip': 'gen:' + s.p.id, style: '--i:' + i },
    h('span', { class: 'medal', text: i + 1 }), avatar(s.p), nameBlock(s.p),
    h('span', {}, h('span', { class: 'chip', text: 'PSL ' + fmt(s.psl) }), h('span', { class: 'chip', text: 'Appeal ' + fmt(s.appeal) })),
    h('span', { class: 'score' }, h('b', { 'data-count': s.ptsAvg, 'data-dec': 1, 'data-ck': 'g' + s.p.id, text: s.ptsAvg.toFixed(1) }), h('small', { text: 'pts · ' + s.n + (s.n === 1 ? ' ballot' : ' ballots') })))));
  return h('section', { class: 'card', style: '--i:1' }, h('h2', { text: 'General Ranking' }),
    h('p', { class: 'sub', text: a.ballots + (a.ballots === 1 ? ' ballot. ' : ' ballots. ') + 'Points out of 100: the top of a ballot earns 100 and the bottom 0, so more is better at any group size.' }),
    a.ranked.length ? list : h('p', { class: 'empty', text: 'No ballots yet. Be the first to submit.' }),
    votesError ? h('p', { class: 'status err', text: votesError }) : null,
    a.unranked.length ? h('p', { class: 'sub', style: 'margin-top:12px', text: 'Not ranked yet: ' + a.unranked.map(s => s.p.name).join(', ') }) : null);
}
function profile(a) {
  const s = a.st[openId];
  const mine = (myDoc().scores || {})[openId];
  const back = h('button', { class: 'ghost', text: '← Back to rankings', onclick: () => { openId = null; animate = true; render(); } });
  const rk = r => r.m[openId] ? '#' + r.m[openId] + ' of ' + r.total : 'Not rated';
  const tile = (i, t, v, sm, pct) => h('div', { class: 'tile', style: '--i:' + i }, h('small', { text: t }), h('b', { text: v }),
    pct != null ? h('div', { class: 'bar' }, h('i', { style: '--w:' + pct + '%' })) : null, h('small', { text: sm }));
  return h('div', {}, back, h('section', { class: 'card', style: 'margin-top:12px;--i:0' },
    h('div', { class: 'hero' }, avatar(s.p, true), h('div', {}, h('h2', { text: s.p.name }), h('p', { class: 'sub', style: 'margin:0', text: s.p.subtitle }),
      s.p.description ? h('p', { class: 'desc', text: s.p.description }) : null)),
    h('p', { style: 'margin:16px 0 0' }, s.ptsAvg == null ? h('span', { class: 'big', text: '–' }) : h('span', { class: 'big', 'data-count': s.ptsAvg, 'data-dec': 1, 'data-ck': 'pf', text: s.ptsAvg.toFixed(1) })),
    h('p', { class: 'sub', text: 'points out of 100 · higher is better' }),
    h('div', { class: 'tiles' },
      tile(0, 'Overall rank', a.ov.m[openId] ? '#' + a.ov.m[openId] + ' of ' + a.ov.total : 'Not ranked yet', 'By points · ' + s.n + ' ballots', s.ptsAvg),
      tile(1, 'PSL', s.psl == null ? '–' : fmt(s.psl) + ' / 8', rk(a.pr) + ' · ' + s.pn + ' votes', s.psl == null ? 0 : s.psl / 8 * 100),
      tile(2, 'Appeal', s.appeal == null ? '–' : fmt(s.appeal) + ' / 10', rk(a.ar) + ' · ' + s.an + ' votes', s.appeal == null ? 0 : s.appeal / 10 * 100),
      tile(3, 'Your rating', mine ? fmt(mine.psl) + ' · ' + fmt(mine.appeal) : 'Not rated', '')),
    h('p', { class: 'sub', text: 'Profiles are read-only. Use the Your ranking panel to rank or rate.' })));
}

/* ---------- render ---------- */
function themeLabel() {
  const t = document.documentElement.getAttribute('data-theme');
  const dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  return { dark, text: dark ? '☀️ Light' : '🌙 Dark' };
}
function countUps(fresh) {
  $app.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, dec = +el.dataset.dec || 0, k = el.dataset.ck;
    const from = fresh ? 0 : (prevNums[k] ?? 0); prevNums[k] = to;
    if (RM || from === to) return;
    const t0 = performance.now();
    (function step(t) {
      const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (from + (to - from) * e).toFixed(dec);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}
function render() {
  if (dragging) { pendingRender = true; return; }
  if (sliding) { pendingRender = true; return; }
  const ready = rosterLoaded && votesLoaded && mineInit;
  const enter = ready && animate && !RM;
  if (ready && animate) animate = false;
  if (enter) Object.keys(prevNums).forEach(k => delete prevNums[k]);
  const scrollY = window.scrollY, old = {};
  $app.querySelectorAll('[data-flip]').forEach(e => { old[e.dataset.flip] = e.getBoundingClientRect(); });
  if (openId && !byId(openId)) openId = null;
  const toggle = h('button', { class: 'ghost', style: 'margin-left:auto', text: themeLabel().text, 'aria-label': 'Toggle theme', onclick: () => {
    const next = themeLabel().dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('chad-theme', next); } catch (e) {}
    render();
  } });
  const head = h('header', {}, h('h1', {}, 'Chad ', h('span', { class: 'r', text: 'Ranking' }), ' ', h('span', { class: 'crown', text: '👑' })), toggle);
  const tag = h('p', { class: 'tag', text: storage.mode === 'shared' ? 'Everyone’s ballots count live.' : 'Votes are NOT shared yet: your ballot is saved in this browser only until the owner connects the shared database.' + notice });
  const body = [head, tag];
  if (!ready) body.push(h('p', { class: 'empty', text: 'Connecting…' }));
  else if (openId) body.push(profile(aggregate()));
  else {
    if (!roster.length) body.push(h('p', { class: 'empty', text: window.ROSTER ? 'The roster is empty. Check back soon.' : "roster.js didn't load. Make sure it sits next to index.html in the repo." }));
    body.push(h('div', { class: 'grid' }, myRanking(), general(aggregate())));
  }
  $app.className = enter ? 'enter' : '';
  $app.replaceChildren(...body);
  statusFresh = false;
  window.scrollTo(0, scrollY);
  if (!enter && !RM) $app.querySelectorAll('[data-flip]').forEach(e => {
    const o = old[e.dataset.flip]; if (!o) return;
    const n = e.getBoundingClientRect(), dx = o.left - n.left, dy = o.top - n.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
  countUps(enter);
  if (focusKey) { const b = $app.querySelector('[data-key="' + focusKey + '"]'); if (b) b.focus(); focusKey = null; }
}
document.addEventListener('pointerdown', e => { if (e.target.type === 'range') sliding = true; });
window.addEventListener('pointercancel', () => { sliding = false; });
window.addEventListener('pointerup', () => { sliding = false; if (!dragging && pendingRender) { pendingRender = false; setTimeout(render, 60); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

/* ---------- boot ---------- */
(async function boot() {
  if (window.FIREBASE_CONFIG) {
    try { storage = await firebaseAdapter(window.FIREBASE_CONFIG); }
    catch (e) { console.warn(e); notice = ' Shared voting failed to start: ' + (e.code || e.message) + '.'; }
  }
  storage.onRoster(list => { roster = list; rosterLoaded = true; tryInit(); render(); });
  storage.onVotes(v => { votes = v; votesLoaded = true; tryInit(); render(); },
    e => { votesError = "Couldn't load everyone's ballots (" + (e.code || e.message) + '). Check that the Firestore rules from the README are published.'; });
})();
</script>
</body>
